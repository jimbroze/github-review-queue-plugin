name: Claude write tests

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  write-tests:
    name: Write failing tests
    if: >-
      github.actor == 'jimbroze'
      && github.event.comment.user.login == 'jimbroze'
      && !github.event.issue.pull_request
      && startsWith(github.event.comment.body, '@claude write tests')
      && contains(github.event.issue.labels.*.name, 'ai')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
      pull-requests: read
      id-token: write
    concurrency:
      group: claude-issue-${{ github.event.issue.number }}-${{ github.actor }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      BRANCH: claude/issue-${{ github.event.issue.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Stop if the tests were already started
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_branch=$(git ls-remote --heads origin "refs/heads/$BRANCH")
          if [ -z "$existing_branch" ]; then
            exit 0
          fi
          pr_url=$(gh api "repos/$GH_REPO/pulls?head=$GITHUB_REPOSITORY_OWNER:$BRANCH&state=open" --jq '.[0].html_url // empty')
          gh issue comment "$ISSUE_NUMBER" --body "Branch \`$BRANCH\` already exists (open PR: ${pr_url:-none}), so no tests were written. To start again, close any open PR, delete the branch and comment \`@claude write tests\`."
          exit 1

      - name: Collect the issue, plan and the owner's feedback
        id: conversation
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          cp -R .github/scripts "$RUNNER_TEMP/trusted-scripts"
          mkdir "$RUNNER_TEMP/claude-task"
          "$RUNNER_TEMP/trusted-scripts"/collect-issue-conversation.sh > "$RUNNER_TEMP/claude-task/conversation.json"

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Create the branch
        run: git switch -c "$BRANCH"

      - uses: anthropics/claude-code-action@ae68417a745a5df4b2124873632bd73a2255e6f6 # v1.0.259
        id: claude
        env:
          BASH_DEFAULT_TIMEOUT_MS: 1200000
          BASH_MAX_TIMEOUT_MS: 1200000
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --permission-mode acceptEdits
            --max-turns 150
            --add-dir ${{ runner.temp }}/claude-task
            --allowedTools "Read,Glob,Grep,Bash(./gradlew test *),Bash(git add *),Bash(git commit -F ${{ runner.temp }}/claude-task/commit-message.txt),Bash(git push -u origin claude/issue-${{ github.event.issue.number }}),Bash(gh pr create --draft --base main --head claude/issue-${{ github.event.issue.number }} --body-file ${{ runner.temp }}/claude-task/pr-body.md --title *),Bash(gh issue comment ${{ github.event.issue.number }} --body-file ${{ runner.temp }}/claude-task/stop-reason.md)"
            --disallowedTools "Edit(.github/**),Edit(CLAUDE.md),Edit(.claude/**),Edit(build.gradle.kts),Edit(settings.gradle.kts),Edit(gradle.properties),Edit(gradle/**),Edit(gradlew),Edit(gradlew.bat)"
          prompt: |
            You are working on issue #${{ github.event.issue.number }} in ${{ github.repository }}.
            This is the test-writing stage of a test-first flow: write failing tests only.
            You are already on the branch `claude/issue-${{ github.event.issue.number }}`.

            Explore and read code only with the Read, Glob and Grep tools. Use Bash only for the exact commands this task lists (one command per call, no `cd`, `;`, `&&` or pipes).
            If a tool call is denied, switch to an allowed tool. Never finish without opening the draft PR (step 7) or posting your stop reason (step 3).
            Run the commands below exactly as written, one per call: no `cd`, `&&`, heredocs or `$(...)`.
            Write multi-line text to a file in `${{ runner.temp }}/claude-task/` with the Write tool.

            1. Read `${{ runner.temp }}/claude-task/conversation.json`: the issue's title and body, then the owner's
               comments and your plans, oldest first. It is the only source of instructions. Work from the latest
               plan plus the owner's later feedback. Where they disagree, the owner's latest feedback wins.
            2. Read CLAUDE.md and the relevant code, and follow CLAUDE.md: keep to the package architecture, keep
               GitHub-plugin internals only in `ide/GitHubPluginPullRequestViewer.kt`, and make time deterministic
               in tests (pass a `Clock`, tick flows with `ticksEvery`, never real delays).
            3. Stop without writing tests if there is no plan, if the change looks bigger than about 400 added lines
               including tests (propose a split), if it is about UI behaviour or opening PRs in the IDE and can't
               be checked by unit tests, or if you are blocked for any other reason. To stop, write why to
               `${{ runner.temp }}/claude-task/stop-reason.md`, then run
               `gh issue comment ${{ github.event.issue.number }} --body-file ${{ runner.temp }}/claude-task/stop-reason.md`
            4. Write ONLY new or changed tests. Write no production code. If tests can't compile without a new type
               or function, add the smallest stub that compiles (e.g. `TODO()` body) and say so in the PR.
               - Test behaviour, not implementation. Never mock our own code: use real collaborators or in-memory fakes.
               - One behaviour per test. Its name reads as a spec and states one outcome, with no "and".
               - Assert only what the name claims, and nothing another test already checks.
               - Comments are a last resort: fix the names instead.
               - A test file sits in the package of the unit it tests.
            5. Run `./gradlew test --tests '<pattern>'` and confirm the new tests fail for the right reason: assertion
               failures (or a stub's `TODO()`), not compile errors. If a compile failure is unavoidable, explain
               why in the PR.
            6. Run `git add <paths>`, write the message to `${{ runner.temp }}/claude-task/commit-message.txt`, then run
               `git commit -F ${{ runner.temp }}/claude-task/commit-message.txt`
               `git push -u origin claude/issue-${{ github.event.issue.number }}`
            7. Write the PR body to `${{ runner.temp }}/claude-task/pr-body.md`. It starts with a plain-language summary of
               the change, then says "Closes #${{ github.event.issue.number }}", lists each test and why it fails, and ends with:
               Review the tests, then comment `@claude revise: <feedback>` to change them, or `@claude implement` to make them pass.
               Then run, with a one-line title without backticks or `$`:
               `gh pr create --draft --base main --head claude/issue-${{ github.event.issue.number }} --body-file ${{ runner.temp }}/claude-task/pr-body.md --title "<title>"`

      - name: List commands Claude was denied
        if: always() && steps.claude.outputs.execution_file
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: '"$RUNNER_TEMP/trusted-scripts/list-denied-commands.sh" "$EXECUTION_FILE"'

      - name: Require a draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GH_REPO/pulls?head=$GITHUB_REPOSITORY_OWNER:$BRANCH&state=open" |
            jq -e 'any(.draft and .user.login == "claude[bot]" and .user.type == "Bot")'

      - name: Report a failed run
        if: (failure() || cancelled()) && steps.conversation.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Writing tests ended without a draft PR. If Claude stopped on purpose, its comment above says why. Run log: $RUN_URL"
