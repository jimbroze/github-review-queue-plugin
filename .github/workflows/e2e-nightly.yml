name: End-to-end tests (nightly)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  e2e:
    name: WebStorm ${{ matrix.ide }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ide: ["2026.2.3", "eap"]
    env:
      REVIEW_QUEUE_E2E_GITHUB_TOKEN: ${{ secrets.REVIEW_QUEUE_E2E_GITHUB_TOKEN }}
      REVIEW_QUEUE_E2E_REPO: ${{ secrets.REVIEW_QUEUE_E2E_REPO }}
      REVIEW_QUEUE_E2E_PR: ${{ secrets.REVIEW_QUEUE_E2E_PR }}
      REVIEW_QUEUE_E2E_FORK: ${{ secrets.REVIEW_QUEUE_E2E_FORK }}
      REVIEW_QUEUE_E2E_IDE_LICENSE: ${{ secrets.REVIEW_QUEUE_E2E_IDE_LICENSE }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v5
      - name: Run end-to-end tests
        run: xvfb-run --auto-servernum ./gradlew integrationTest -Pe2eIde=${{ matrix.ide }}
      - name: Keep test reports and IDE logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.ide }}
          path: |
            build/reports/tests/integrationTest
            out/ide-tests/tests
          if-no-files-found: ignore
